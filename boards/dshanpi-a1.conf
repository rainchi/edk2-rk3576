# 100ASK DShanPi A1
#
# Early port: boots from the eMMC to the UEFI front page (2026-11-26).
# See docs/boards/dshanpi-a1.md.
PLATFORM_NAME=DShanPiA1
DSC_FILE=Platform/100ASK/DShanPiA1/DShanPiA1.dsc
DEVICE_TREE_NAME=rk3576-100ask-dshanpi-a1
# No SPI NOR.  The BootROM boots this board from the SD card when the eMMC has
# nothing bootable on it, so the firmware and the NV variable store live on the
# SD card, as on the CM5-IO.
BOOT_MEDIUM=sdcard

# scripts/build-spl.sh builds the SPL from these, into out/DShanPiA1/
# idbloader.img, which package.sh uses.  Mainline U-Boot has no defconfig for
# this board but its dts/upstream has the board's device tree, so the defconfig
# here is the TaishanPi 3M's with the device tree swapped.  The DDR blob covers
# LPDDR4/4X and LPDDR5; the board in hand has LPDDR4X.
SPL_UBOOT_TAG=v2026.10
SPL_UBOOT_COMMIT=5508406582f6f7120dce0c4b3059819a41788db2
SPL_PATCH_DIR=uboot/v2026.10
SPL_BOARD_DIR=uboot/v2026.10/dshanpi-a1
SPL_DEFCONFIG=dshanpi-a1-rk3576_defconfig
SPL_DTS=rk3576-100ask-dshanpi-a1.dts
SPL_DDR_BLOB=rk3576_ddr_lp4_2112MHz_lp5_2736MHz_v1.08.bin
SPL_DDR_SHA256=7403cf1663d4b0c9d7c692014e0852e60f0d3977209ec75fa755c293f54e2d50

# The board's eMMC (64 GB, "AT2S9C"): 0x747C000 sectors, from the firmware's
# ExtCSD dump.  With this set package.sh also builds DShanPiA1-emmc.img: the
# same firmware with a partition table in front, the rest of the eMMC as one
# data partition.
EMMC_BYTES=62537072640
